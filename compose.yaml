services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
      POSTGRES_DB: card
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U card -d card']
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://card:card@db:5432/card
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
